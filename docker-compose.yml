# Development stack: web, api, worker, db (SPEC section 9). Start with `make dev`.
name: niveshcouncil

x-python: &python
  build:
    context: .
    dockerfile: services/Dockerfile
    secrets: [extra_ca]
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-nivesh}:${POSTGRES_PASSWORD:-nivesh}@db:5432/${POSTGRES_DB:-nivesh}
  volumes:
    - ./services:/app/services
    - ./db:/app/db
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nivesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nivesh}
      POSTGRES_DB: ${POSTGRES_DB:-nivesh}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *python
    command: >
      sh -c "python -m services.migrate &&
             uvicorn services.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir services"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    <<: *python
    command: sh -c "python -m services.migrate && python -m services.worker.main"

  web:
    build:
      context: apps/web
      secrets: [extra_ca]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  extra_ca:
    file: ${EXTRA_CA_CERT_FILE:-./docker/empty-ca.crt}

[project]
name = "niveshcouncil"
version = "0.1.0"
description = "Personal research app for Indian equities: factor screen plus a 7-agent council. See docs/SPEC.md."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10,<4",
    "kiteconnect>=5.2.2",
    "defusedxml>=0.7.1",
    "anthropic>=2.14.0",
    "pypdf>=7.1.1",
    "numpy>=2.5.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["services", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "kiteconnect", "kiteconnect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running Postgres (TEST_DATABASE_URL)",
]
